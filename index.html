<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chùa Hương Online - Đại Chánh Điện Trực Tiếp</title>
    <style>
        :root {
            --gold: #f1c40f;
            --dark-gold: #d4ac0d;
            --bg-color: #0f0f0f;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background-color: var(--bg-color);
            color: #fff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }
        
        /* Giao diện khung Live dạng Điện thoại thời thượng */
        .live-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            max-width: 450px;
            max-height: 850px;
            background: linear-gradient(to bottom, #2c1a04, #000);
            border: 4px solid #222;
            border-radius: 20px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            box-shadow: 0 20px 50px rgba(0,0,0,0.8);
        }

        /* Thanh trạng thái Live phía trên */
        .live-header {
            position: absolute;
            top: 15px; left: 15px; right: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 10;
        }
        .live-badge {
            background-color: #e74c3c;
            color: white;
            padding: 4px 10px;
            font-weight: bold;
            font-size: 0.8rem;
            border-radius: 5px;
            text-transform: uppercase;
            letter-spacing: 1px;
            animation: pulse 1.5s infinite;
        }
        @keyframes pulse {
            0% { opacity: 0.6; }
            50% { opacity: 1; }
            100% { opacity: 0.6; }
        }
        .viewer-count {
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(5px);
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.85rem;
            display: flex;
            align-items: center;
            gap: 6px;
            border: 1px solid rgba(255,255,255,0.1);
        }
        .viewer-count::before {
            content: '👁️';
        }

        /* Khu vực Chánh Điện thờ Phật */
        .buddha-zone {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding-top: 60px;
            position: relative;
        }
        .buddha-img {
            width: 240px;
            filter: drop-shadow(0 0 25px rgba(241, 196, 15, 0.7));
            transition: transform 0.1s;
            z-index: 2;
        }
        
        /* Khói hương nghi ngút */
        .incense-container {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin-top: 10px;
            height: 40px;
        }
        .incense-stick {
            width: 3px; height: 35px;
            background-color: #8e44ad;
            position: relative;
            border-radius: 2px;
        }
        .incense-stick::after {
            content: ''; position: absolute; top: 0; left: 50%;
            width: 4px; height: 4px; background-color: #ff5722;
            border-radius: 50%; transform: translateX(-50%);
            box-shadow: 0 0 6px #ff5722;
        }
        .smoke {
            position: absolute; top: -25px; left: -5px;
            width: 10px; height: 25px;
            background: rgba(255,255,255,0.06);
            border-radius: 50%; filter: blur(3px);
            animation: floatSmoke 2.5s infinite linear;
        }
        @keyframes floatSmoke {
            0% { transform: translateY(0) scale(1) translateX(0); opacity: 0; }
            20% { opacity: 0.3; }
            50% { transform: translateY(-20px) scale(1.4) translateX(4px); opacity: 0.15; }
            100% { transform: translateY(-40px) scale(1.8) translateX(-4px); opacity: 0; }
        }

        /* Khung bình luận nhảy chữ liên tục ở góc trái dưới */
        .chat-zone {
            height: 200px;
            padding: 15px;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            z-index: 5;
            background: linear-gradient(to top, rgba(0,0,0,0.8), transparent);
        }
        .chat-container {
            overflow: hidden;
            display: flex;
            flex-direction: column;
            gap: 6px;
            font-size: 0.85rem;
            max-height: 100%;
        }
        .chat-message {
            background: rgba(255, 255, 255, 0.08);
            padding: 6px 12px;
            border-radius: 12px;
            animation: slideIn 0.3s ease-out forwards;
            width: fit-content;
            max-width: 85%;
            border-left: 3px solid var(--gold);
        }
        .chat-name { color: var(--gold); font-weight: bold; margin-right: 5px; }
        @keyframes slideIn { from { transform: translateY(20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }

        /* Thông báo đẩy Quà tặng/Công đức đặc biệt bên phải */
        .gift-alert-zone {
            position: absolute;
            right: 15px;
            bottom: 310px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            z-index: 10;
        }
        .gift-alert {
            background: linear-gradient(90deg, rgba(230, 126, 34, 0.9), rgba(0,0,0,0.4));
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: bold;
            color: #fff;
            border: 1px solid var(--gold);
            animation: popIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }
        @keyframes popIn { from { transform: scale(0.5) translateX(50px); opacity: 0; } to { transform: scale(1) translateX(0); opacity: 1; } }

        /* Bảng thống kê thông số */
        .live-stats {
            background: rgba(255,255,255,0.03);
            border-top: 1px solid rgba(255,255,255,0.08);
            border-bottom: 1px solid rgba(255,255,255,0.08);
            display: flex;
            justify-content: space-around;
            padding: 8px 0;
            font-size: 0.8rem;
        }
        .stat-val { color: var(--gold); font-weight: bold; font-size: 1rem; display: block; text-align: center; margin-top: 2px; }

        /* Hệ thống nút bấm tương tác phía dưới */
        .action-zone {
            padding: 15px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            background-color: #080808;
        }
        button {
            background: linear-gradient(135deg, #d35400, #e67e22);
            color: white; border: 1px solid var(--gold);
            padding: 12px; font-size: 0.9rem; font-weight: bold;
            border-radius: 10px; cursor: pointer; transition: all 0.15s;
        }
        button:active { transform: scale(0.95); }
        button.btn-incense { background: linear-gradient(135deg, #27ae60, #2ecc71); }
        button.btn-que { background: linear-gradient(135deg, #2c3e50, #34495e); }
        button.btn-lich { background: linear-gradient(135deg, #8e44ad, #9b59b6); }

        /* Chữ +1 Công đức bay màu vàng */
        .floating-text {
            position: absolute; color: var(--gold); font-weight: bold;
            font-size: 1.1rem; pointer-events: none;
            animation: flyUp 0.8s ease-out forwards; z-index: 10;
        }
        @keyframes flyUp { 0% { transform: translateY(0); opacity: 1; } 100% { transform: translateY(-70px); opacity: 0; } }

        /* Hộp thoại hiển thị thông tin quẻ/lịch */
        .display-modal {
            position: absolute;
            bottom: 230px; left: 15px; right: 15px;
            background: rgba(20, 20, 20, 0.95);
            border: 2px solid var(--gold);
            border-radius: 12px; padding: 12px;
            display: none; z-index: 15;
            box-shadow: 0 10px 25px rgba(0,0,0,0.6);
            animation: fadeInUp 0.3s;
        }
        @keyframes fadeInUp { from { transform: translateY(15px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        .modal-title { color: var(--gold); font-weight: bold; font-size: 0.95rem; margin-bottom: 4px; display: flex; justify-content: space-between; }
        .close-btn { cursor: pointer; color: #aaa; }
        .modal-body { font-size: 0.85rem; line-height: 1.4; color: #ddd; }
    </style>
</head>
<body>

    <div class="live-container">
        <!-- Thanh tiêu đề Live & Mắt xem thực tế ảo -->
        <div class="live-header">
            <div class="live-badge">TRỰC TIẾP</div>
            <!-- Mắt xem nhảy liên tục lôi cuốn -->
            <div class="viewer-count"><span id="live-viewers">1,245</span></div>
        </div>

        <!-- Đại Chánh Điện -->
        <div class="buddha-zone" id="altar">
            <!-- Tượng Phật vàng SVG bảo đảm hiển thị sắc nét 100% không sợ lỗi link -->
            <svg class="buddha-img" id="buddha" viewBox="0 0 100 100" xmlns="http://w3.org">
