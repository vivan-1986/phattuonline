<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Chùa Online 3D - Phật Tử</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Serif:wght@400;700&display=swap');
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { overflow: hidden; font-family: 'Noto Serif', serif; background: #000; color: #f5e6c8; }
  #canvas { display: block; width: 100vw; height: 100vh; }
  #ui { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 10; }
  #ui * { pointer-events: auto; }
  .panel {
    position: absolute; background: rgba(0,0,0,0.82);
    border: 2px solid #c9a227; border-radius: 16px;
    padding: 16px 20px; backdrop-filter: blur(10px);
  }
  #loginPanel {
    top: 50%; left: 50%; transform: translate(-50%,-50%);
    text-align: center; width: 360px;
  }
  #loginPanel h1 { font-size: 1.7rem; margin-bottom: 8px; text-shadow: 0 0 15px #ffd700; }
  #loginPanel input {
    width: 100%; padding: 13px; margin: 12px 0; border-radius: 30px;
    border: none; font-size: 1.15rem; text-align: center; font-family: inherit;
  }
  .btn {
    background: linear-gradient(#c9a227, #8B6914);
    color: #1a0a00; border: none; padding: 12px 22px;
    border-radius: 30px; font-weight: bold; cursor: pointer;
    font-family: inherit; font-size: 1.05rem; margin: 6px;
    box-shadow: 0 4px 14px rgba(0,0,0,0.5);
  }
  .btn:disabled { opacity: 0.45; cursor: not-allowed; }
  .btn:hover:not(:disabled) { transform: translateY(-2px); }
  #hud { top: 12px; left: 12px; display: none; font-size: 1rem; }
  #actionPanel {
    bottom: 18px; left: 50%; transform: translateX(-50%);
    display: none; text-align: center; min-width: 320px;
  }
  #resultPanel {
    top: 50%; left: 50%; transform: translate(-50%,-50%);
    display: none; max-width: 420px; text-align: center;
  }
  #resultPanel .que-so { font-size: 2.2rem; color: #ffd700; }
  #resultPanel .que-ten { font-size: 1.4rem; margin: 8px 0; }
  #musicBtn {
    position: absolute; bottom: 18px; right: 18px;
    width: 56px; height: 56px; border-radius: 50%; font-size: 1.5rem; display: none;
  }
  #bigMusicBtn {
    position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%);
    display: none; padding: 18px 40px; font-size: 1.3rem; z-index: 20;
  }
  #info {
    position: absolute; bottom: 18px; left: 18px;
    font-size: 0.85rem; opacity: 0.8; display: none;
  }
</style>
</head>
<body>
<canvas id="canvas"></canvas>

<div id="ui">
  <div class="panel" id="loginPanel">
    <h1>🙏 Chùa Online 3D</h1>
    <p>Nhập pháp danh / tên Phật tử</p>
    <input type="text" id="username" placeholder="Tên Phật tử..." maxlength="20">
    <br>
    <button class="btn" onclick="login()">Vào Chùa</button>
  </div>

  <div class="panel" id="hud">
    <div id="userName" style="font-size:1.15rem;color:#ffd700"></div>
    <div style="margin-top:5px" id="locName">Đang ở: Sân chùa</div>
  </div>

  <div class="panel" id="actionPanel">
    <div id="statusText" style="margin-bottom:10px">Click quả cầu vàng để đến khu vực</div>
    <button class="btn" id="lightBtn" onclick="lightIncense()" disabled>🕯️ Thắp Hương</button>
    <button class="btn" id="prayBtn" onclick="pray()" disabled>🙏 Cầu Nguyện</button>
    <button class="btn" id="drawBtn" onclick="drawQue()" disabled>🎋 Bốc Quẻ</button>
    <br>
    <button class="btn" onclick="goHome()">🏠 Về Sân</button>
  </div>

  <div class="panel" id="resultPanel">
    <div class="que-so" id="queSo"></div>
    <div class="que-ten" id="queTen"></div>
    <div id="queNoiDung" style="margin:12px 0;line-height:1.55"></div>
    <button class="btn" onclick="closeResult()">Đóng</button>
  </div>

  <button class="btn" id="musicBtn" onclick="toggleMusic()">🔇</button>
  <button class="btn" id="bigMusicBtn" onclick="forcePlayMusic()">🔊 BẬT ÂM THANH CHÙA</button>
  <div id="info">Kéo để xoay • Lăn để zoom • Click quả cầu vàng</div>
</div>

<audio id="bgMusic" loop preload="auto">
  <source src="nhac-chua.mp3" type="audio/mpeg">
</audio>
<audio id="bellSound" preload="auto">
  <source src="chuong.mp3" type="audio/mpeg">
</audio>
<audio id="chantSound" loop preload="auto">
  <source src="tung-kinh.mp3" type="audio/mpeg">
</audio>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script>
const locations = {
  home:     { name: "Sân chùa",      pos: new THREE.Vector3(0, 10, 36), look: new THREE.Vector3(0, 5, 0) },
  chinhdien:{ name: "Chính Điện",    pos: new THREE.Vector3(0, 7, 16), look: new THREE.Vector3(0, 5, 0) },
  vuon:     { name: "Vườn Thiền",    pos: new THREE.Vector3(-22, 7, 12), look: new THREE.Vector3(-22, 3, 0) },
  thap:     { name: "Tháp Cổ",       pos: new THREE.Vector3(22, 10, 14), look: new THREE.Vector3(22, 9, 0) },
  ao:       { name: "Ao Sen",        pos: new THREE.Vector3(0, 6, -18), look: new THREE.Vector3(0, 2, -26) },
  quanam:   { name: "Điện Quan Âm",  pos: new THREE.Vector3(-16, 8, -8), look: new THREE.Vector3(-16, 8, -18) },
  thien:    { name: "Nhà Thiền",     pos: new THREE.Vector3(14, 6, -10), look: new THREE.Vector3(14, 3, -18) }
};

const queList = [];
const tenMau = ["Đại Cát","Trung Cát","Tiểu Cát","Bình An","Cẩn Thận","Hạnh Thông","May Mắn","Chờ Thời","Tu Tâm","Quý Nhân","Tài Lộc","Tình Duyên"];
const noiDungMau = [
  "Mọi sự hanh thông, công việc thuận lợi. Hãy vững tin hành động.",
  "Công việc bình thường. Cần kiên nhẫn và cẩn thận.",
  "Có niềm vui nhỏ, sức khỏe tốt. Giữ tâm thanh tịnh.",
  "Đường đi thuận lợi, quý nhân phù trợ.",
  "Cần thận trọng lời nói và hành động.",
  "Rất tốt! Tài lộc, tình duyên đều thuận.",
  "Gia đạo yên ổn. Giữ lòng từ bi sẽ được phù hộ.",
  "Chưa phải lúc hành động. Hãy kiên nhẫn chờ thời.",
  "Có tin vui bất ngờ. Tài vận khá tốt.",
  "Nên quay về nội tâm, làm việc thiện nhiều hơn.",
  "Tài lộc vừa phải, đừng tham lam.",
  "Tình duyên đang có tín hiệu tốt."
];
for (let i = 1; i <= 72; i++) {
  queList.push({ so: i, ten: "Quẻ " + tenMau[i % tenMau.length], noiDung: noiDungMau[i % noiDungMau.length] });
}

let scene, camera, renderer, controls;
let currentUser = null, currentLoc = "home", incenseLit = false, musicOn = false;
let incenseParticles = [], hotspots = [], walkingPeople = [];
let raycaster = new THREE.Raycaster();
let mouse = new THREE.Vector2();
let clock = new THREE.Clock();

function init3D() {
  scene = new THREE.Scene();
  scene.background = new THREE.Color(0x080400);
  scene.fog = new THREE.FogExp2(0x1a0a00, 0.014);

  camera = new THREE.PerspectiveCamera(55, innerWidth / innerHeight, 0.1, 300);
  camera.position.copy(locations.home.pos);

  renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('canvas'), antialias: true });
  renderer.setSize(innerWidth, innerHeight);
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  renderer.shadowMap.enabled = true;

  controls = new THREE.OrbitControls(camera, renderer.domElement);
  controls.enableDamping = true;
  controls.dampingFactor = 0.07;
  controls.minDistance = 6;
  controls.maxDistance = 60;
  controls.maxPolarAngle = Math.PI / 2.05;
  controls.target.copy(locations.home.look);

  scene.add(new THREE.AmbientLight(0xffe8c0, 0.4));
  const dir = new THREE.DirectionalLight(0xfff5e0, 0.95);
  dir.position.set(30, 50, 25);
  dir.castShadow = true;
  scene.add(dir);

  // Đất
  const ground = new THREE.Mesh(
    new THREE.PlaneGeometry(120, 120),
    new THREE.MeshStandardMaterial({ color: 0x3a2a1c, roughness: 0.9 })
  );
  ground.rotation.x = -Math.PI / 2;
  ground.receiveShadow = true;
  scene.add(ground);

  buildMainHall();
  buildBuddhaStatue();
  buildQuanAmStatue();          // Tượng Quan Âm to
  buildGarden();
  buildPagoda();
  buildPond();
  buildMeditationHall();
  createLanterns();             // Lồng đèn
  createHotspots();
  createRealisticPeople();      // Người thật hơn

  window.addEventListener('resize', () => {
    camera.aspect = innerWidth / innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(innerWidth, innerHeight);
  });
  renderer.domElement.addEventListener('pointerdown', onPointerDown);

  animate();
}

// ========== TƯỢNG PHẬT CHÍNH ==========
function buildBuddhaStatue() {
  const g = new THREE.Group();
  const lotus = new THREE.Mesh(new THREE.CylinderGeometry(1.9, 2.3, 0.7, 16), new THREE.MeshStandardMaterial({ color: 0xffd700, metalness: 0.55, roughness: 0.3 }));
  lotus.position.y = 0.35; g.add(lotus);

  const body = new THREE.Mesh(new THREE.SphereGeometry(1.4, 28, 28), new THREE.MeshStandardMaterial({ color: 0xffe066, metalness: 0.35, roughness: 0.4 }));
  body.position.y = 2.1; body.scale.set(1, 1.3, 0.9); g.add(body);

  const head = new THREE.Mesh(new THREE.SphereGeometry(0.9, 24, 24), new THREE.MeshStandardMaterial({ color: 0xffec99, metalness: 0.3, roughness: 0.45 }));
  head.position.y = 3.9; g.add(head);

  const hair = new THREE.Mesh(new THREE.SphereGeometry(0.6, 16, 16), new THREE.MeshStandardMaterial({ color: 0x1a1a1a }));
  hair.position.y = 4.55; g.add(hair);

  g.position.set(0, 2.3, -2);
  scene.add(g);

  const light = new THREE.PointLight(0xffd700, 2.2, 15);
  light.position.set(0, 7, 2);
  scene.add(light);
}

// ========== TƯỢNG QUAN ÂM TO CAO ==========
function buildQuanAmStatue() {
  const g = new THREE.Group();

  // Đài sen lớn
  const base = new THREE.Mesh(new THREE.CylinderGeometry(2.8, 3.4, 1.2, 18), new THREE.MeshStandardMaterial({ color: 0xffd700, metalness: 0.5, roughness: 0.35 }));
  base.position.y = 0.6; g.add(base);

  // Thân cao
  const body = new THREE.Mesh(new THREE.CylinderGeometry(1.1, 1.6, 6.5, 16), new THREE.MeshStandardMaterial({ color: 0xf5e6c8, metalness: 0.25, roughness: 0.5 }));
  body.position.y = 4.5; g.add(body);

  // Đầu
  const head = new THREE.Mesh(new THREE.SphereGeometry(1.1, 24, 24), new THREE.MeshStandardMaterial({ color: 0xffe0b3, metalness: 0.2, roughness: 0.5 }));
  head.position.y = 8.6; g.add(head);

  // Tóc / mão
  const hair = new THREE.Mesh(new THREE.SphereGeometry(0.85, 16, 16), new THREE.MeshStandardMaterial({ color: 0x222222 }));
  hair.position.y = 9.4; g.add(hair);

  // Áo choàng rộng
  const robe = new THREE.Mesh(new THREE.CylinderGeometry(2.0, 2.8, 5.5, 16, 1, true), new THREE.MeshStandardMaterial({ color: 0xffffff, side: THREE.DoubleSide, transparent: true, opacity: 0.85 }));
  robe.position.y = 4.2; g.add(robe);

  // Hào quang
  const halo = new THREE.Mesh(new THREE.RingGeometry(2.2, 2.8, 32), new THREE.MeshBasicMaterial({ color: 0xffd700, side: THREE.DoubleSide, transparent: true, opacity: 0.6 }));
  halo.position.y = 8.6; halo.rotation.y = Math.PI / 2; g.add(halo);

  g.position.set(-16, 0, -20);
  scene.add(g);

  // Ánh sáng mạnh cho tượng Quan Âm
  const ql = new THREE.PointLight(0xffeebb, 2.5, 25);
  ql.position.set(-16, 12, -15);
  scene.add(ql);
}

// ========== LỒNG ĐÈN ==========
function createLanterns() {
  const positions = [
    [8, 7, 8], [-8, 7, 8], [10, 6, -5], [-10, 6, -5],
    [18, 8, 5], [-18, 7, 3], [0, 9, -8], [12, 6, -14],
    [-12, 7, -12], [6, 5, -22], [-6, 5, -22]
  ];
  positions.forEach(([x, y, z]) => {
    const group = new THREE.Group();
    // Khung lồng đèn
    const frame = new THREE.Mesh(new THREE.CylinderGeometry(0.45, 0.45, 1.1, 8, 1, true), new THREE.MeshStandardMaterial({ color: 0x8B0000, side: THREE.DoubleSide }));
    group.add(frame);
    // Nắp
    const top = new THREE.Mesh(new THREE.ConeGeometry(0.55, 0.4, 8), new THREE.MeshStandardMaterial({ color: 0x5c0000 }));
    top.position.y = 0.75; group.add(top);
    // Đáy
    const bottom = new THREE.Mesh(new THREE.CylinderGeometry(0.5, 0.35, 0.25, 8), new THREE.MeshStandardMaterial({ color: 0x5c0000 }));
    bottom.position.y = -0.65; group.add(bottom);

    // Ánh sáng bên trong
    const light = new THREE.PointLight(0xffaa33, 1.3, 10);
    light.position.y = 0;
    group.add(light);

    group.position.set(x, y, z);
    scene.add(group);
  });
}

// ========== NGƯỜI THẬT HƠN ==========
function createRealisticPerson(x, z, robeColor = 0xd4a017) {
  const g = new THREE.Group();

  // Chân
  const legGeo = new THREE.CylinderGeometry(0.14, 0.16, 0.9, 8);
  const legMat = new THREE.MeshStandardMaterial({ color: 0x3d1c00 });
  const legL = new THREE.Mesh(legGeo, legMat); legL.position.set(-0.18, 0.45, 0); g.add(legL);
  const legR = new THREE.Mesh(legGeo, legMat); legR.position.set(0.18, 0.45, 0); g.add(legR);

  // Thân
  const body = new THREE.Mesh(new THREE.CylinderGeometry(0.32, 0.38, 1.15, 10), new THREE.MeshStandardMaterial({ color: robeColor }));
  body.position.y = 1.4; g.add(body);

  // Vai / áo rộng
  const shoulder = new THREE.Mesh(new THREE.CylinderGeometry(0.48, 0.42, 0.5, 10), new THREE.MeshStandardMaterial({ color: robeColor }));
  shoulder.position.y = 1.95; g.add(shoulder);

  // Đầu
  const head = new THREE.Mesh(new THREE.SphereGeometry(0.27, 14, 14), new THREE.MeshStandardMaterial({ color: 0xffdbac }));
  head.position.y = 2.45; g.add(head);

  // Tóc
  const hair = new THREE.Mesh(new THREE.SphereGeometry(0.28, 10, 10), new THREE.MeshStandardMaterial({ color: 0x222222 }));
  hair.position.y = 2.6; hair.scale.set(1, 0.7, 1); g.add(hair);

  // Tay
  const armGeo = new THREE.CylinderGeometry(0.1, 0.11, 0.85, 8);
  const armMat = new THREE.MeshStandardMaterial({ color: robeColor });
  const armL = new THREE.Mesh(armGeo, armMat); armL.position.set(-0.48, 1.55, 0); armL.rotation.z = 0.3; g.add(armL);
  const armR = new THREE.Mesh(armGeo, armMat); armR.position.set(0.48, 1.55, 0); armR.rotation.z = -0.3; g.add(armR);

  g.position.set(x, 0, z);
  g.userData = {
    baseX: x, baseZ: z,
    angle: Math.random() * Math.PI * 2,
    speed: 0.35 + Math.random() * 0.45,
    radius: 4 + Math.random() * 5,
    legL, legR, phase: Math.random() * Math.PI * 2
  };
  scene.add(g);
  return g;
}

function createRealisticPeople() {
  walkingPeople.push(createRealisticPerson(-9, 12));
  walkingPeople.push(createRealisticPerson(9, 14, 0xc9a227));
  walkingPeople.push(createRealisticPerson(-17, 6, 0x8B4513));
  walkingPeople.push(createRealisticPerson(6, -6));
  walkingPeople.push(createRealisticPerson(16, 9, 0xd4a017));
  walkingPeople.push(createRealisticPerson(-5, 18, 0xb8860b));
  walkingPeople.push(createRealisticPerson(4, 8, 0xcd853f));
}

// ========== CÁC CÔNG TRÌNH KHÁC ==========
function buildMainHall() {
  const base = new THREE.Mesh(new THREE.BoxGeometry(17, 1.7, 14), new THREE.MeshStandardMaterial({ color: 0x5c3a21 }));
  base.position.set(0, 0.85, 0); base.castShadow = true; scene.add(base);

  const wall = new THREE.Mesh(new THREE.BoxGeometry(15, 7.5, 12), new THREE.MeshStandardMaterial({ color: 0x7a4a28 }));
  wall.position.set(0, 5.3, 0); wall.castShadow = true; scene.add(wall);

  const roof = new THREE.Mesh(new THREE.ConeGeometry(12, 5, 4), new THREE.MeshStandardMaterial({ color: 0x8B0000 }));
  roof.position.set(0, 11.2, 0); roof.rotation.y = Math.PI/4; roof.castShadow = true; scene.add(roof);

  [-6.5, 6.5].forEach(x => {
    const col = new THREE.Mesh(new THREE.CylinderGeometry(0.5, 0.6, 7.5, 12), new THREE.MeshStandardMaterial({ color: 0x4a2c0b }));
    col.position.set(x, 5.3, 6.5); col.castShadow = true; scene.add(col);
  });

  const altar = new THREE.Mesh(new THREE.BoxGeometry(5.5, 1, 2), new THREE.MeshStandardMaterial({ color: 0x3d1c00 }));
  altar.position.set(0, 2.2, 4.5); scene.add(altar);

  for (let i = -1; i <= 1; i++) {
    const stick = new THREE.Mesh(new THREE.CylinderGeometry(0.05, 0.05, 1.4, 6), new THREE.MeshStandardMaterial({ color: 0x8B4513 }));
    stick.position.set(i * 0.5, 3.2, 4.8); scene.add(stick);
  }
}

function buildGarden() {
  for (let i = 0; i < 12; i++) {
    const tree = new THREE.Group();
    const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.3, 0.4, 3.5, 8), new THREE.MeshStandardMaterial({ color: 0x4a3728 }));
    trunk.position.y = 1.75; tree.add(trunk);
    const leaves = new THREE.Mesh(new THREE.SphereGeometry(2.1, 9, 9), new THREE.MeshStandardMaterial({ color: 0x2d5a27 }));
    leaves.position.y = 4.3; tree.add(leaves);
    tree.position.set(-24 + (i%6)*3.8, 0, -8 + Math.floor(i/6)*8);
    scene.add(tree);
  }
}

function buildPagoda() {
  const pagoda = new THREE.Group();
  for (let i = 0; i < 5; i++) {
    const size = 4.5 - i * 0.6;
    const level = new THREE.Mesh(new THREE.BoxGeometry(size, 2, size), new THREE.MeshStandardMaterial({ color: i%2 ? 0x8B0000 : 0x5c0000 }));
    level.position.y = 1.2 + i * 2.4; pagoda.add(level);
    const roof = new THREE.Mesh(new THREE.ConeGeometry(size*0.95, 1.4, 4), new THREE.MeshStandardMaterial({ color: 0x4a0000 }));
    roof.position.y = 2.4 + i * 2.4; roof.rotation.y = Math.PI/4; pagoda.add(roof);
  }
  pagoda.position.set(22, 0, 0); scene.add(pagoda);
}

function buildPond() {
  const water = new THREE.Mesh(new THREE.CircleGeometry(10, 48), new THREE.MeshStandardMaterial({ color: 0x1a4a5c, transparent: true, opacity: 0.75, roughness: 0.12 }));
  water.rotation.x = -Math.PI/2; water.position.set(0, 0.05, -28); scene.add(water);
  for (let i = 0; i < 9; i++) {
    const lotus = new THREE.Mesh(new THREE.SphereGeometry(0.4, 10, 10), new THREE.MeshStandardMaterial({ color: 0xff69b4 }));
    const a = (i/9)*Math.PI*2;
    lotus.position.set(Math.cos(a)*4.5, 0.4, -28 + Math.sin(a)*4.5); scene.add(lotus);
  }
}

function buildMeditationHall() {
  const floor = new THREE.Mesh(new THREE.BoxGeometry(11, 0.45, 9), new THREE.MeshStandardMaterial({ color: 0x4a3728 }));
  floor.position.set(14, 0.22, -18); scene.add(floor);
  const roof = new THREE.Mesh(new THREE.BoxGeometry(12, 0.35, 10), new THREE.MeshStandardMaterial({ color: 0x5c0000 }));
  roof.position.set(14, 4.8, -18); scene.add(roof);
  [[10,-14],[18,-14],[10,-22],[18,-22]].forEach(([x,z]) => {
    const col = new THREE.Mesh(new THREE.CylinderGeometry(0.28, 0.32, 4.5, 10), new THREE.MeshStandardMaterial({ color: 0x3d1c00 }));
    col.position.set(x, 2.5, z); scene.add(col);
  });
  for (let i = 0; i < 3; i++) {
    const bench = new THREE.Mesh(new THREE.BoxGeometry(3.8, 0.4, 0.75), new THREE.MeshStandardMaterial({ color: 0x5c3a21 }));
    bench.position.set(14, 0.55, -15.2 - i*2.3); scene.add(bench);
  }
}

function createHotspots() {
  const list = [
    { name: "chinhdien", pos: [0, 2.3, 7] },
    { name: "vuon", pos: [-22, 2.3, 4] },
    { name: "thap", pos: [22, 2.3, 7] },
    { name: "ao", pos: [0, 2.3, -18] },
    { name: "quanam", pos: [-16, 2.3, -12] },
    { name: "thien", pos: [14, 2.3, -12] }
  ];
  list.forEach(p => {
    const s = new THREE.Mesh(new THREE.SphereGeometry(0.6, 16, 16), new THREE.MeshBasicMaterial({ color: 0xffd700, transparent: true, opacity: 0.8 }));
    s.position.set(...p.pos); s.userData = { type: "hotspot", loc: p.name };
    scene.add(s); hotspots.push(s);
  });
}

function addSmoke() {
  const count = 120;
  const geo = new THREE.BufferGeometry();
  const pos = new Float32Array(count * 3);
  const vels = [];
  for (let i = 0; i < count; i++) {
    pos[i*3] = (Math.random()-0.5)*1.2;
    pos[i*3+1] = Math.random()*0.7;
    pos[i*3+2] = (Math.random()-0.5)*0.5;
    vels.push({ x:(Math.random()-0.5)*0.015, y:0.03+Math.random()*0.025, z:(Math.random()-0.5)*0.015 });
  }
  geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  const mat = new THREE.PointsMaterial({ color: 0xeeeeee, size: 0.3, transparent: true, opacity: 0.55, depthWrite: false });
  const pts = new THREE.Points(geo, mat);
  pts.position.set(0, 3.8, 4.8);
  pts.userData = { velocities: vels };
  scene.add(pts);
  incenseParticles.push(pts);
}

// ========== TƯƠNG TÁC ==========
function onPointerDown(e) {
  if (!currentUser) return;
  mouse.x = (e.clientX / innerWidth) * 2 - 1;
  mouse.y = -(e.clientY / innerHeight) * 2 + 1;
  raycaster.setFromCamera(mouse, camera);
  const hits = raycaster.intersectObjects(hotspots);
  if (hits.length) goTo(hits[0].object.userData.loc);
}

function goTo(loc) {
  currentLoc = loc;
  incenseLit = false;
  document.getElementById('locName').textContent = "Đang ở: " + locations[loc].name;
  document.getElementById('statusText').textContent = "Hãy thắp hương tại đây";
  document.getElementById('lightBtn').disabled = false;
  document.getElementById('prayBtn').disabled = true;
  document.getElementById('drawBtn').disabled = true;

  const chant = document.getElementById('chantSound');
  if (loc === "thien" || loc === "quanam") {
    chant.volume = 0.4;
    chant.play().catch(()=>{});
  } else {
    chant.pause();
  }
  animateCamera(locations[loc].pos, locations[loc].look);
}

function goHome() {
  goTo("home");
  document.getElementById('statusText').textContent = "Click quả cầu vàng để đến khu vực";
  document.getElementById('lightBtn').disabled = true;
  document.getElementById('chantSound').pause();
}

function animateCamera(pos, look) {
  const startP = camera.position.clone();
  const startL = controls.target.clone();
  let t = 0;
  (function step() {
    t += 0.026;
    if (t > 1) t = 1;
    camera.position.lerpVectors(startP, pos, t);
    controls.target.lerpVectors(startL, look, t);
    if (t < 1) requestAnimationFrame(step);
  })();
}

function lightIncense() {
  if (incenseLit) return;
  incenseLit = true;
  addSmoke();
  document.getElementById('lightBtn').disabled = true;
  document.getElementById('prayBtn').disabled = false;
  document.getElementById('statusText').textContent = "Hương đã thắp. Hãy cầu nguyện";
  playBell();
}

function pray() {
  document.getElementById('prayBtn').disabled = true;
  document.getElementById('drawBtn').disabled = false;
  document.getElementById('statusText').textContent = "Đã cầu nguyện. Bốc quẻ đi nào";
  playBell();
}

function drawQue() {
  document.getElementById('drawBtn').disabled = true;
  document.getElementById('statusText').textContent = "Đang gieo quẻ...";
  playBell();
  setTimeout(() => {
    const q = queList[Math.floor(Math.random() * 72)];
    document.getElementById('queSo').textContent = "Quẻ số " + q.so;
    document.getElementById('queTen').textContent = q.ten;
    document.getElementById('queNoiDung').textContent = q.noiDung;
    document.getElementById('resultPanel').style.display = "block";
    const key = "chua3d_" + currentUser;
    const data = JSON.parse(localStorage.getItem(key) || '{"history":[]}');
    data.history.push({ time: new Date().toLocaleString("vi-VN"), loc: locations[currentLoc].name, que: "Quẻ " + q.so });
    localStorage.setItem(key, JSON.stringify(data));
  }, 1600);
}

function closeResult() {
  document.getElementById('resultPanel').style.display = "none";
  document.getElementById('statusText').textContent = "Nam Mô A Di Đà Phật";
}

function login() {
  const name = document.getElementById("username").value.trim();
  if (!name) return alert("Vui lòng nhập tên Phật tử!");
  currentUser = name;
  localStorage.setItem("chua3d_user", name);

  document.getElementById("loginPanel").style.display = "none";
  document.getElementById("hud").style.display = "block";
  document.getElementById("actionPanel").style.display = "block";
  document.getElementById("musicBtn").style.display = "block";
  document.getElementById("info").style.display = "block";
  document.getElementById("userName").textContent = "Phật tử " + name;

  // Hiện nút bật nhạc to
  document.getElementById("bigMusicBtn").style.display = "block";

  init3D();
}

function forcePlayMusic() {
  const bg = document.getElementById("bgMusic");
  bg.volume = 0.5;
  bg.play().then(() => {
    musicOn = true;
    document.getElementById("musicBtn").textContent = "🔊";
    document.getElementById("bigMusicBtn").style.display = "none";
  }).catch(err => {
    alert("Không phát được nhạc.\nHãy kiểm tra 3 file mp3 đã đúng tên và cùng thư mục chưa.");
  });
}

function toggleMusic() {
  const bg = document.getElementById("bgMusic");
  if (musicOn) {
    bg.pause();
    document.getElementById("musicBtn").textContent = "🔇";
  } else {
    bg.volume = 0.5;
    bg.play().catch(()=>{});
    document.getElementById("musicBtn").textContent = "🔊";
  }
  musicOn = !musicOn;
}

function playBell() {
  const bell = document.getElementById("bellSound");
  bell.currentTime = 0;
  bell.volume = 0.75;
  bell.play().catch(()=>{});
}

// ========== ANIMATION ==========
function animate() {
  requestAnimationFrame(animate);
  const t = clock.getElapsedTime();
  controls.update();

  // Khói
  incenseParticles.forEach(p => {
    const arr = p.geometry.attributes.position.array;
    const vels = p.userData.velocities;
    for (let i = 0; i < vels.length; i++) {
      arr[i*3] += vels[i].x;
      arr[i*3+1] += vels[i].y;
      arr[i*3+2] += vels[i].z;
      if (arr[i*3+1] > 6) {
        arr[i*3+1] = 0;
        arr[i*3] = (Math.random()-0.5)*1.2;
      }
    }
    p.geometry.attributes.position.needsUpdate = true;
    p.material.opacity = 0.4 + Math.sin(t*2)*0.15;
  });

  // Người đi + vung chân
  walkingPeople.forEach(p => {
    const d = p.userData;
    d.angle += d.speed * 0.007;
    p.position.x = d.baseX + Math.cos(d.angle) * d.radius;
    p.position.z = d.baseZ + Math.sin(d.angle) * d.radius;
    p.rotation.y = -d.angle + Math.PI/2;

    // Động tác chân
    d.phase += 0.15;
    d.legL.rotation.x = Math.sin(d.phase) * 0.5;
    d.legR.rotation.x = Math.sin(d.phase + Math.PI) * 0.5;
  });

  // Hotspot
  hotspots.forEach((h, i) => {
    h.material.opacity = 0.55 + Math.sin(t*3 + i)*0.3;
    h.position.y = 2.3 + Math.sin(t*2.2 + i)*0.18;
  });

  renderer.render(scene, camera);
}

window.onload = () => {
  const saved = localStorage.getItem("chua3d_user");
  if (saved) document.getElementById("username").value = saved;
};
</script>
